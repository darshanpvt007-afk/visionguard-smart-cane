<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Arial, Helvetica, sans-serif" font-size="22">
<rect width="1600" height="1000" fill="#fff"/>
<!-- rails -->
<line x1="80" y1="110" x2="1540" y2="110" stroke="#D32F2F" stroke-width="5"/>
<text x="1540" y="92" text-anchor="end" fill="#D32F2F" font-weight="bold">+5 V rail (battery after switch)</text>
<line x1="80" y1="920" x2="1540" y2="920" stroke="#111" stroke-width="5"/>
<text x="1540" y="958" text-anchor="end" font-weight="bold">GND rail</text>
<!-- battery + switch -->
<line x1="110" y1="110" x2="110" y2="180" stroke="#D32F2F" stroke-width="4"/>
<circle cx="110" cy="186" r="6" fill="#fff" stroke="#111" stroke-width="3"/>
<line x1="110" y1="240" x2="140" y2="192" stroke="#111" stroke-width="4"/>
<circle cx="110" cy="246" r="6" fill="#fff" stroke="#111" stroke-width="3"/>
<line x1="110" y1="252" x2="110" y2="320" stroke="#D32F2F" stroke-width="4"/>
<text x="150" y="225">Rocker switch</text>
<rect x="60" y="320" width="100" height="180" rx="10" fill="#E9D5F5" stroke="#6A1B9A" stroke-width="3"/>
<text x="110" y="350" text-anchor="middle" font-weight="bold">+</text>
<text x="110" y="490" text-anchor="middle" font-weight="bold">−</text>
<text x="175" y="400">18650 Li-ion</text><text x="175" y="428">3.7 V 1200 mAh</text>
<line x1="110" y1="500" x2="110" y2="920" stroke="#111" stroke-width="4"/>
<!-- moisture probe -->
<rect x="170" y="600" width="140" height="170" rx="10" fill="#FFF2B3" stroke="#B08900" stroke-width="3"/>
<text x="240" y="670" text-anchor="middle" font-weight="bold">Moisture</text><text x="240" y="698" text-anchor="middle" font-weight="bold">probe</text><text x="240" y="728" text-anchor="middle" font-size="18">(cane tip)</text>
<line x1="310" y1="650" x2="380" y2="650" stroke="#7B1FA2" stroke-width="4"/>
<line x1="310" y1="720" x2="380" y2="720" stroke="#888" stroke-width="4"/>
<!-- LM393 -->
<rect x="380" y="600" width="150" height="170" rx="10" fill="#E3F0FB" stroke="#1F4E79" stroke-width="3"/>
<text x="455" y="690" text-anchor="middle" font-weight="bold">LM393</text><text x="455" y="716" text-anchor="middle" font-size="18">module</text>
<text x="420" y="630" text-anchor="middle" font-size="16">VCC</text><text x="490" y="760" text-anchor="middle" font-size="16">GND</text>
<text x="522" y="655" text-anchor="end" font-size="16">A0</text><text x="522" y="725" text-anchor="end" font-size="16">D0</text>
<line x1="420" y1="600" x2="420" y2="110" stroke="#D32F2F" stroke-width="4"/>
<line x1="490" y1="770" x2="490" y2="920" stroke="#111" stroke-width="4"/>
<polyline points="530,650 590,650 590,560 620,560" fill="none" stroke="#666" stroke-width="4"/>
<text x="478" y="800" text-anchor="end" font-size="18" fill="#888">D0: not connected</text>
<!-- Nano -->
<rect x="620" y="260" width="280" height="560" rx="14" fill="#1F4E79" stroke="#0D2B47" stroke-width="3"/>
<text x="760" y="520" text-anchor="middle" fill="#fff" font-size="28" font-weight="bold">Arduino</text>
<text x="760" y="556" text-anchor="middle" fill="#fff" font-size="28" font-weight="bold">Nano</text>
<text x="760" y="590" text-anchor="middle" fill="#D9EAF7" font-size="18">ATmega328P</text>
<g fill="#fff" font-size="20" font-weight="bold">
<text x="632" y="327">5V</text><text x="632" y="567">A0</text><text x="632" y="787">GND</text>
<text x="888" y="337" text-anchor="end">D5</text><text x="888" y="407" text-anchor="end">D6</text>
<text x="888" y="607" text-anchor="end">D2</text><text x="888" y="707" text-anchor="end">D3</text>
</g>
<polyline points="620,320 560,320 560,110" fill="none" stroke="#D32F2F" stroke-width="4"/>
<polyline points="620,780 560,780 560,920" fill="none" stroke="#111" stroke-width="4"/>
<!-- HC-SR04 -->
<rect x="1100" y="220" width="300" height="240" rx="12" fill="#E3F0FB" stroke="#1F4E79" stroke-width="3"/>
<circle cx="1200" cy="320" r="45" fill="#ccc" stroke="#555" stroke-width="3"/><circle cx="1310" cy="320" r="45" fill="#ccc" stroke="#555" stroke-width="3"/>
<text x="1255" y="420" text-anchor="middle" font-weight="bold">HC-SR04</text>
<g font-size="16"><text x="1108" y="255">VCC</text><text x="1108" y="345">Trig</text><text x="1108" y="415">Echo</text><text x="1340" y="452">GND</text></g>
<polyline points="1100,250 1050,250 1050,110" fill="none" stroke="#D32F2F" stroke-width="4"/>
<line x1="900" y1="330" x2="1100" y2="330" stroke="#EF6C00" stroke-width="4"/>
<text x="1000" y="318" text-anchor="middle" font-size="18">Trig</text>
<line x1="900" y1="400" x2="1100" y2="400" stroke="#F9A825" stroke-width="4"/>
<text x="1000" y="388" text-anchor="middle" font-size="18">Echo</text>
<line x1="1360" y1="460" x2="1360" y2="920" stroke="#111" stroke-width="4"/>
<!-- buzzer -->
<line x1="900" y1="600" x2="1000" y2="600" stroke="#2F7D32" stroke-width="4"/>
<rect x="1000" y="560" width="200" height="80" rx="10" fill="#E6F4EA" stroke="#2F7D32" stroke-width="3"/>
<text x="1100" y="597" text-anchor="middle" font-weight="bold">Buzzer</text><text x="1100" y="624" text-anchor="middle" font-size="16">active, 5 V</text>
<polyline points="1200,600 1260,600 1260,920" fill="none" stroke="#111" stroke-width="4"/>
<!-- vibration planned -->
<line x1="900" y1="700" x2="1000" y2="700" stroke="#999" stroke-width="4" stroke-dasharray="10,8"/>
<rect x="1000" y="670" width="220" height="100" rx="10" fill="#F5F5F5" stroke="#999" stroke-width="3" stroke-dasharray="10,8"/>
<text x="1110" y="710" text-anchor="middle" fill="#777" font-size="18" font-weight="bold">Vibration motor</text>
<text x="1110" y="738" text-anchor="middle" fill="#777" font-size="16">planned, via MOSFET</text>
<!-- capacitor -->
<line x1="1480" y1="110" x2="1480" y2="500" stroke="#D32F2F" stroke-width="4"/>
<line x1="1450" y1="500" x2="1510" y2="500" stroke="#111" stroke-width="5"/>
<line x1="1450" y1="520" x2="1510" y2="520" stroke="#111" stroke-width="5"/>
<line x1="1480" y1="520" x2="1480" y2="920" stroke="#111" stroke-width="4"/>
<text x="1518" y="500" font-size="18">C</text><text x="1500" y="560" font-size="16">220–</text><text x="1500" y="580" font-size="16">470 µF</text>
<!-- dots -->
<g fill="#D32F2F"><circle cx="110" cy="110" r="7"/><circle cx="420" cy="110" r="7"/><circle cx="560" cy="110" r="7"/><circle cx="1050" cy="110" r="7"/><circle cx="1480" cy="110" r="7"/></g>
<g fill="#111"><circle cx="110" cy="920" r="7"/><circle cx="490" cy="920" r="7"/><circle cx="560" cy="920" r="7"/><circle cx="1260" cy="920" r="7"/><circle cx="1360" cy="920" r="7"/><circle cx="1480" cy="920" r="7"/></g>
</svg>
